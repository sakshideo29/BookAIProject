server.port=8080
spring.application.name=bookai-backend

# ---- Gemini API config ----
# Set your real key as an environment variable, never commit it:
#   export GEMINI_API_KEY=your_key_here
gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=gemini-3.6-flash
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta/models

# ---- CORS ----
app.cors.allowed-origin=http://localhost:5173

# ---- Logging ----
logging.level.com.bookai=INFO
logging.level.org.springframework.web.reactive.function.client=WARN
