spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ---- Gemini API config ----
# Set your real key as an environment variable, never commit it:
#   export GEMINI_API_KEY=your_key_here
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_TEXT_MODEL:gemini-3.5-flash}
gemini.embedding.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
gemini.embedding.dimensions=${GEMINI_EMBEDDING_DIMENSIONS:768}
gemini.api.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}

# ---- CORS ----
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:https://bookaiproject.netlify.app/}

# ---- Logging ----
logging.level.com.bookai=INFO
logging.level.org.springframework.web.reactive.function.client=WARN

# ---- File upload (PDF ingestion) ----
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB